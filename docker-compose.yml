name: keitaro-manager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keitaro_manager}
      POSTGRES_USER: ${POSTGRES_USER:-keitaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keitaro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-keitaro}:${POSTGRES_PASSWORD:-keitaro}@db:5432/${POSTGRES_DB:-keitaro_manager}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (cp .env.example .env)}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      KEITARO_API_URL: ${KEITARO_API_URL:-}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      KEITARO_TIMEOUT: ${KEITARO_TIMEOUT:-15}
      KEITARO_MAX_CONCURRENCY: ${KEITARO_MAX_CONCURRENCY:-8}
    expose:
      - "8000"

  frontend:
    build:
      context: frontend
      additional_contexts:
        nginxconf: ./nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  postgres_data:
