name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keitaro_manager
          POSTGRES_USER: keitaro
          POSTGRES_PASSWORD: keitaro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keitaro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@localhost:5432/keitaro_manager
      KEITARO_IT_URL: ${{ secrets.KEITARO_IT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic
      - name: Migrations on a clean PostgreSQL (upgrade, drift check, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q
      # Live Keitaro tests run only when the repository has these secrets configured.
      - name: Integration tests (real Keitaro, read-only)
        if: ${{ env.KEITARO_IT_URL != '' }}
        env:
          KEITARO_IT_API_KEY: ${{ secrets.KEITARO_IT_API_KEY }}
        run: pytest -q tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
